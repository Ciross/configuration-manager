[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "configuration-manager"
version = "0.1.0"
description = "A strongly typed Python SDK for Microsoft Configuration Manager"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "httpx2>=2.12.0,<3",
    "httpx2-negotiate-sspi>=2.0.1,<2.1; sys_platform == 'win32'",
    "truststore>=0.10.4,<1",
]

[dependency-groups]
dev = [
    "pyright>=1.1.405",
    "pytest>=8.4.1",
    "ruff>=0.12.10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/configuration_manager"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "strict"

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]
markers = [
    "integration: tests that exercise complete components with controlled services",
    "live: explicitly opted-in tests that require a Configuration Manager lab",
]

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
docstring-code-format = true
